<svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <pattern id="network" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
    <circle cx="10" cy="10" r="2" fill="white" />
    <circle cx="50" cy="50" r="2" fill="white" />
    <circle cx="90" cy="90" r="2" fill="white" />
    <circle cx="10" cy="90" r="2" fill="white" />
    <circle cx="90" cy="10" r="2" fill="white" />
    <line x1="10" y1="10" x2="50" y2="50" stroke="white" stroke-width="0.5" />
    <line x1="50" y1="50" x2="90" y2="90" stroke="white" stroke-width="0.5" />
    <line x1="10" y1="90" x2="50" y2="50" stroke="white" stroke-width="0.5" />
    <line x1="90" y1="10" x2="50" y2="50" stroke="white" stroke-width="0.5" />
  </pattern>
  <rect x="0" y="0" width="100%" height="100%" fill="url(#network)" />
</svg>