<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <title>Connection Error - Settlenet WiFi</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="ie-fixMinHeight">
        <div class="main">
            <div class="wrap animated fadeIn">
                <!-- Settlenet Logo -->
                <img src="logo.png" alt="Settlenet" class="logo" />

                <h1>⚠️ Connection Error</h1>
                <p class="info alert">$(error)</p>
                <p class="info">Please try connecting again or contact support if the problem persists.</p>
                <p class="info">Return to <a href="$(link-login)" style="color: var(--secondary);">login page</a></p>

                <div class="info" style="margin-top: 30px; padding: 20px; background: rgba(30, 64, 175, 0.1); border-radius: 8px;">
                    <p><strong>Need Help?</strong></p>
                    <p>Contact Settlenet support at <a href="#" style="color: var(--secondary);">www.settlenet.co.ke</a></p>
                </div>

                <p class="info bt">Powered by Settlenet Network Solutions</p>
            </div>
        </div>
    </div>
</body>

</html>
